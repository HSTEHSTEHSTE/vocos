# From-scratch 24 kHz causal Vocos conditioned on 75-D LinearVC content features
# plus one random frozen 192-D ECAPA-TDNN utterance embedding from the same
# speaker. Target utterances are excluded from the conditioning candidates.
seed_everything: 4444

data:
  class_path: vocos.dataset.VocosDataModule
  init_args:
    train_params:
      filelist_path: ???
      sampling_rate: 24000
      num_samples: 16320
      batch_size: 6
      num_workers: 8
      feature_root: ???
      feature_source_root: ???
      feature_hop_length: 480
      feature_dim: 75
      use_speaker_transform: false
      use_speaker_embedding: true
      speaker_embedding_dir: ???
      speaker_embedding_dim: 192
      speaker_embedding_cache_size: 64
      speaker_embedding_random_same_speaker: true
      speaker_embedding_exclude_target: true
    val_params:
      filelist_path: ???
      sampling_rate: 24000
      num_samples: 48000
      batch_size: 4
      num_workers: 8
      feature_root: ???
      feature_source_root: ???
      feature_hop_length: 480
      feature_dim: 75
      use_speaker_transform: false
      use_speaker_embedding: true
      speaker_embedding_dir: ???
      speaker_embedding_dim: 192
      speaker_embedding_cache_size: 64
      speaker_embedding_random_same_speaker: true
      speaker_embedding_exclude_target: true

model:
  class_path: vocos.experiment.VocosExp
  init_args:
    sample_rate: 24000
    initial_learning_rate: 5e-4
    mel_loss_coeff: 45
    mrd_loss_coeff: 0.1
    num_warmup_steps: 0
    pretrain_mel_steps: 0
    evaluate_utmos: false
    evaluate_pesq: false
    evaluate_periodicty: false
    feature_extractor:
      class_path: vocos.feature_extractors.PrecomputedWavLMFeatures
      init_args:
        feature_dim: 75
    backbone:
      class_path: vocos.models.CausalVocosBackbone
      init_args:
        input_channels: 75
        dim: 512
        intermediate_dim: 1536
        num_layers: 8
        speaker_embedding_dim: 192
        speaker_conditioner_hidden_dim: 512
    head:
      class_path: vocos.heads.CausalISTFTHead
      init_args:
        dim: 512
        n_fft: 1920
        hop_length: 480

trainer:
  logger:
    class_path: pytorch_lightning.loggers.WandbLogger
    init_args:
      project: vocos-wavlm-causal
      save_dir: logs/
  callbacks:
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        filename: wavlm_causal_content75_ecapa_{epoch}_{step}_{val_loss:.4f}
        save_top_k: 3
        save_last: true
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        filename: wavlm_causal_content75_ecapa_periodic_{step}
        every_n_train_steps: 5000
        save_top_k: 1
        save_last: true
    - class_path: vocos.helpers.SlurmPreemptionCheckpointCallback
    - class_path: vocos.helpers.GradNormCallback
  max_steps: 2000000
  limit_val_batches: 100
  accelerator: gpu
  strategy: ddp
  devices: 1
  log_every_n_steps: 100
