# 24 kHz waveform synthesis conditioned on pre-extracted 50 Hz streaming WavLM-Large features.
# The extraction job uses layer 6, 100 frames of left context, and zero look-ahead.
seed_everything: 4444

data:
  class_path: vocos.dataset.VocosDataModule
  init_args:
    train_params:
      filelist_path: ???
      sampling_rate: 24000
      # Must be divisible by the synthesis hop (480 samples = 20 ms).
      num_samples: 16320
      batch_size: 6
      num_workers: 8
      feature_root: ???
      feature_source_root: ???
      feature_hop_length: 480
      feature_dim: 1024
    val_params:
      filelist_path: ???
      sampling_rate: 24000
      num_samples: 48000
      batch_size: 4
      num_workers: 8
      feature_root: ???
      feature_source_root: ???
      feature_hop_length: 480
      feature_dim: 1024

model:
  class_path: vocos.experiment.VocosExp
  init_args:
    sample_rate: 24000
    initial_learning_rate: 5e-4
    mel_loss_coeff: 45
    mrd_loss_coeff: 0.1
    num_warmup_steps: 0
    pretrain_mel_steps: 0
    evaluate_utmos: false
    evaluate_pesq: false
    evaluate_periodicty: false
    feature_extractor:
      class_path: vocos.feature_extractors.PrecomputedWavLMFeatures
      init_args:
        feature_dim: 1024
    backbone:
      class_path: vocos.models.CausalVocosBackbone
      init_args:
        input_channels: 1024
        dim: 512
        intermediate_dim: 1536
        num_layers: 8
    head:
      class_path: vocos.heads.CausalISTFTHead
      init_args:
        dim: 512
        n_fft: 1920
        hop_length: 480

trainer:
  logger:
    class_path: pytorch_lightning.loggers.WandbLogger
    init_args:
      project: vocos-wavlm-causal
      save_dir: logs/
  callbacks:
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        filename: wavlm_causal_{epoch}_{step}_{val_loss:.4f}
        save_top_k: 3
        save_last: true
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        filename: wavlm_causal_periodic_{step}
        every_n_train_steps: 5000
        save_top_k: 1
        save_last: true
    - class_path: vocos.helpers.SlurmPreemptionCheckpointCallback
    - class_path: vocos.helpers.GradNormCallback
  max_steps: 2000000
  limit_val_batches: 100
  accelerator: gpu
  strategy: ddp
  # Numeric device counts can be overridden for single-node DDP, e.g. --trainer.devices=2.
  devices: 1
  log_every_n_steps: 100
