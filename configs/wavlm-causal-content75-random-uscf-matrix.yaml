# LibriSpeech one-frame 75-D content. Each batch draws one retained Mixer6
# USCF transform S, supplies X @ S @ UTXSS as 75-D content, and conditions
# the causal Vocos backbone on that same S as a static matrix FiLM signal.
seed_everything: 4545

data:
  class_path: vocos.dataset.VocosDataModule
  init_args:
    train_params:
      filelist_path: ???
      sampling_rate: 24000
      num_samples: 16320
      batch_size: 1
      num_workers: 8
      feature_root: ???
      feature_source_root: ???
      feature_hop_length: 480
      feature_dim: 75
      use_speaker_matrix: true
      speaker_matrix_dir: ???
      speaker_matrix_input_dim: 75
      speaker_matrix_output_dim: 1024
      speaker_matrix_cache_size: 64
      speaker_matrix_random: true
    val_params:
      filelist_path: ???
      sampling_rate: 24000
      num_samples: 48000
      batch_size: 1
      num_workers: 8
      feature_root: ???
      feature_source_root: ???
      feature_hop_length: 480
      feature_dim: 75
      use_speaker_matrix: true
      speaker_matrix_dir: ???
      speaker_matrix_input_dim: 75
      speaker_matrix_output_dim: 1024
      speaker_matrix_cache_size: 64
      speaker_matrix_random: true

model:
  class_path: vocos.experiment.VocosExp
  init_args:
    sample_rate: 24000
    initial_learning_rate: 5e-4
    mel_loss_coeff: 45
    mrd_loss_coeff: 0.1
    num_warmup_steps: 0
    pretrain_mel_steps: 0
    evaluate_utmos: false
    evaluate_pesq: true
    evaluate_mrstft: true
    evaluate_periodicty: false
    validation_metric_batches: 4
    validation_metrics_affect_val_loss: false
    feature_extractor:
      class_path: vocos.feature_extractors.RandomUSCFTransformContentFeatures
      init_args:
        utxss_path: ???
    backbone:
      class_path: vocos.models.CausalVocosBackbone
      init_args:
        input_channels: 75
        dim: 512
        intermediate_dim: 1536
        num_layers: 8
        speaker_matrix_input_dim: 75
        speaker_matrix_output_dim: 1024
        speaker_matrix_condition_dim: 256
        speaker_matrix_encoder_layers: 2
        speaker_matrix_encoder_heads: 8
        speaker_matrix_conditioner_hidden_dim: 512
    head:
      class_path: vocos.heads.CausalISTFTHead
      init_args:
        dim: 512
        n_fft: 1920
        hop_length: 480

trainer:
  logger:
    class_path: pytorch_lightning.loggers.WandbLogger
    init_args:
      project: vocos-wavlm-causal
      save_dir: logs/
  callbacks:
    - class_path: pytorch_lightning.callbacks.LearningRateMonitor
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        filename: content75_random_uscf_matrix_{epoch}_{step}_{val_loss:.4f}
        save_top_k: 1
        save_last: false
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        every_n_train_steps: 5000
        save_top_k: 0
        save_last: true
    - class_path: vocos.helpers.SlurmPreemptionCheckpointCallback
    - class_path: vocos.helpers.GradNormCallback
  max_steps: 2000000
  limit_val_batches: 100
  accelerator: gpu
  strategy: ddp
  devices: 1
  log_every_n_steps: 100
